name: rubikctf-challenges

# Red exclusiva de retos. La plataforma (backend/db/web) NO esta en esta red.
services:
  web-sqli-login:
    build:
      context: ./web-sqli-login
    container_name: reto-web-sqli-login
    environment:
      RETO_FLAG: RUBIK{sql_injection_101}
    ports:
      - "8001:5000"
    networks:
      - retos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5

  net-puerto-inesperado:
    build:
      context: ./net-puerto-inesperado
    container_name: reto-net-puerto-inesperado
    environment:
      RETO_FLAG: RUBIK{hidden_port}
    ports:
      - "31337:9000"
    networks:
      - retos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25

  net-banner:
    build:
      context: ./net-banner
    container_name: reto-net-banner
    environment:
      RETO_FLAG: RUBIK{service_banner}
    ports:
      - "8003:8080"
    networks:
      - retos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25

  web-xss:
    build:
      context: ./web-xss
    container_name: reto-web-xss
    environment:
      RETO_FLAG: RUBIK{stored_xss_101}
    ports:
      - "8004:5000"
    networks:
      - retos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    shm_size: 256mb

  web-sqli-banco:
    build:
      context: ./web-sqli-banco
    container_name: reto-web-sqli-banco
    environment:
      RETO_FLAG: RUBIK{sqli_banco_luis_miguel}
    ports:
      - "8005:5000"
    networks:
      - retos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25

  web-rce-diagnostico:
    build:
      context: ./web-rce-diagnostico
    container_name: reto-web-rce-diagnostico
    ports:
      - "8006:5000"
    networks:
      - retos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5

  web-upload-clinica:
    build:
      context: ./web-upload-clinica
    container_name: reto-web-upload-clinica
    ports:
      - "8007:80"
    networks:
      - retos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

  web-hydra-extranet:
    build:
      context: ./web-hydra-extranet
    container_name: reto-web-hydra-extranet
    ports:
      - "8009:5000"
    networks:
      - retos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25

  final-entry:
    build:
      context: ./final-boreal/entry
    container_name: reto-final-entry
    ports:
      - "2222:22"
      - "8088:80"
    networks:
      boreal_pub:
      boreal_int:
        ipv4_address: 10.10.10.10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

  final-internal:
    build:
      context: ./final-boreal/internal
    container_name: reto-final-internal
    networks:
      boreal_int:
        ipv4_address: 10.10.10.20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

networks:
  retos:
    driver: bridge
  boreal_pub:
    driver: bridge
  boreal_int:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.10.0/24
